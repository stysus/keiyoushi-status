---
name: Status

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - deploy_only
          - scrape_only
  schedule:
    # Low activity: 23:00-08:00 UTC
    - cron: '53 2 * * 0'
    - cron: '29 6 * * 1'
    - cron: '16 3 * * 2'
    - cron: '57 23 * * 2'
    - cron: '39 7 * * 4'
    - cron: '22 0 * * 5'
    - cron: '33 3 * * 6'
  push:
    branches:
      - main
    paths:
      - .github/scripts/**
      - .github/workflows/status.yaml
      - web/**

concurrency:
  group: status
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      should_scrape: ${{ steps.flags.outputs.should_scrape }}
      should_deploy: ${{ steps.flags.outputs.should_deploy }}
      extensions_shards: ${{ steps.shards.outputs.shards }}
      total_shards: ${{ steps.shards.outputs.total_shards }}
    steps:
      - uses: actions/checkout@v6

      - name: Filter changed paths on push
        uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'push'
        with:
          filters: |
            scripts:
              - '.github/scripts/**'
              - '.github/workflows/status.yaml'

      - name: Determine execution flags
        id: flags
        run: |
          SHOULD_SCRAPE=true
          SHOULD_DEPLOY=true

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
            if [ "$MODE" = "deploy_only" ]; then
              SHOULD_SCRAPE=false
              SHOULD_DEPLOY=true
            elif [ "$MODE" = "scrape_only" ]; then
              SHOULD_SCRAPE=true
              SHOULD_DEPLOY=false
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            if [ "${{ steps.filter.outputs.scripts }}" = "false" ]; then
              SHOULD_SCRAPE=false
              SHOULD_DEPLOY=true
            fi
          fi

          echo "should_scrape=$SHOULD_SCRAPE" >> "$GITHUB_OUTPUT"
          echo "should_deploy=$SHOULD_DEPLOY" >> "$GITHUB_OUTPUT"
          echo "Determined flags: should_scrape=$SHOULD_SCRAPE, should_deploy=$SHOULD_DEPLOY"

      - name: Setup uv for shard calculation
        if: steps.flags.outputs.should_scrape == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: '.github/scripts/*.py'

      - name: Calculate extensions matrix shards
        id: shards
        if: steps.flags.outputs.should_scrape == 'true'
        run: |
          SHARDS_JSON=$(.github/scripts/check_extensions.py --get-shards 100 2>/dev/null)
          echo "shards=$(echo "$SHARDS_JSON" | jq -c '.shards')" >> "$GITHUB_OUTPUT"
          echo "total_shards=$(echo "$SHARDS_JSON" | jq -r '.total_shards')" >> "$GITHUB_OUTPUT"
          echo "Generated shards: $SHARDS_JSON"

  scrape-extensions:
    needs: detect
    if: needs.detect.outputs.should_scrape == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.detect.outputs.extensions_shards) }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup uv with dependency caching
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: '.github/scripts/*.py'

      - name: Run extensions status check shard
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          TOTAL_SHARDS: ${{ needs.detect.outputs.total_shards }}
        run: .github/scripts/check_extensions.py

      - name: Upload extensions shard artifact
        uses: actions/upload-artifact@v4
        with:
          name: extensions-shard-${{ matrix.shard }}
          path: web/data/extensions_shard_${{ matrix.shard }}.json
          retention-days: 1
          if-no-files-found: error

  scrape-issues:
    needs: detect
    if: needs.detect.outputs.should_scrape == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup uv with dependency caching
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: '.github/scripts/*.py'

      - name: Run issues status check
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/check_issues.py

      - name: Upload issues artifacts
        uses: actions/upload-artifact@v4
        with:
          name: issues-output
          path: web/data/issues.json
          retention-days: 1
          if-no-files-found: error

  process:
    needs: [detect, scrape-extensions, scrape-issues]
    if: always() && (needs.detect.outputs.should_scrape == 'true' || needs.detect.outputs.should_deploy == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Verify scrape jobs success
        if: needs.detect.outputs.should_scrape == 'true'
        run: |
          if [ "${{ needs.scrape-extensions.result }}" != "success" ] || [ "${{ needs.scrape-issues.result }}" != "success" ]; then
            echo "Scrape jobs failed or were cancelled."
            exit 1
          fi

      - name: Download all extensions shards
        if: needs.detect.outputs.should_scrape == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: extensions-shard-*
          path: web/data/shards
          merge-multiple: true

      - name: Download issues artifacts
        if: needs.detect.outputs.should_scrape == 'true'
        uses: actions/download-artifact@v4
        with:
          name: issues-output
          path: web/data

      - name: Setup uv with dependency caching
        if: needs.detect.outputs.should_scrape == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: '.github/scripts/*.py'

      - name: Merge extensions shards
        if: needs.detect.outputs.should_scrape == 'true'
        run: .github/scripts/check_extensions.py --merge

      - name: Checkout extensions source
        if: needs.detect.outputs.should_scrape == 'true'
        uses: actions/checkout@v6
        with:
          repository: keiyoushi/extensions-source
          path: extensions-source
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: src

      - name: Run map bug issues script
        if: needs.detect.outputs.should_scrape == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/map_bug_issues.py

      - name: Commit updated status files
        if: needs.detect.outputs.should_scrape == 'true'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: update extensions, issues, and bug issue map'
          file_pattern: 'web/data/*.json'

      - name: Setup Pages
        if: needs.detect.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: needs.detect.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/

  deploy:
    needs: [detect, process]
    if: needs.detect.outputs.should_deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
